services:
  # 1. Primary SmartNeb Backend API & WebSocket Server
  - type: web
    name: smartneb-backend-api
    env: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install && node scripts/prepare-db.js && npx prisma generate
    startCommand: node scripts/prepare-db.js --wait && npx prisma db push --accept-data-loss && node scripts/seed-demo-users.js && node server.js
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: smartneb-production-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: GEMINI_API_KEY
        sync: false

databases:
  # 2. Managed Production Database
  - name: smartneb-production-db
    databaseName: smartneb_prod
    user: smartneb_admin
    region: oregon
    plan: free
