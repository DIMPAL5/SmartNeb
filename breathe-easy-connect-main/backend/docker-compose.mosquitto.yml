version: '3.8'

services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: smartneb-dev-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./mqtt/acl.conf:/mosquitto/config/acl.conf
    restart: unless-stopped
