# ==============================================================================
# SMARTNEB PRODUCTION MOSQUITTO BROKER CONFIGURATION
# TLS MQTTS: Port 8883 | TLS WSS: Port 8084
# ==============================================================================

# Standard MQTTS Listener (Port 8883 - Hardware devices)
listener 8883 0.0.0.0
protocol mqtt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
cafile /mosquitto/certs/ca.crt
require_certificate false

# WebSockets over TLS Listener (Port 8084 - Web/Mobile Clients)
listener 8084 0.0.0.0
protocol websockets
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key

# Authentication & ACL Access Control
allow_anonymous false
password_file /mosquitto/config/passwords
acl_file /mosquitto/config/acl.conf

# Logging & Persistence
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
