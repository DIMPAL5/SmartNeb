version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartneb-prod-backend
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=5000
    env_file:
      - .env.production
    depends_on:
      - mosquitto
    networks:
      - smartneb-prod-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: smartneb-prod-mosquitto
    restart: always
    ports:
      - "8883:8883"   # MQTTS (MQTT over TLS)
      - "8084:8084"   # WSS (MQTT over WebSockets TLS)
    volumes:
      - ./mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mqtt/acl.conf:/mosquitto/config/acl.conf:ro
      - ./mqtt/certs:/mosquitto/certs:ro
    networks:
      - smartneb-prod-network

  proxy:
    image: nginx:alpine
    container_name: smartneb-prod-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/smartneb.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/letsencrypt:ro
    depends_on:
      - backend
    networks:
      - smartneb-prod-network

networks:
  smartneb-prod-network:
    driver: bridge
