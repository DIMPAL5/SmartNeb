# ==============================================================================
# SMARTNEB PRODUCTION NGINX REVERSE PROXY CONFIGURATION
# Supports: HTTPS (TLS 1.3), HTTP/2, WebSocket (wss://), Socket.IO Sticky Routing
# ==============================================================================

upstream smartneb_backend_cluster {
  # ip_hash ensures sticky sessions for Socket.IO HTTP long-polling fallback
  ip_hash;
  server 127.0.0.1:5000 max_fails=3 fail_timeout=10s;
  keepalive 64;
}

# Redirect all HTTP to HTTPS
server {
  listen 80;
  listen [::]:80;
  server_name api.smartneb.health app.smartneb.health;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# Primary HTTPS Server Block
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name api.smartneb.health;

  # TLS Hardening
  ssl_certificate /etc/letsencrypt/live/api.smartneb.health/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.smartneb.health/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
  ssl_prefer_server_ciphers on;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  # Security Headers (HIPAA / GDPR / OWASP)
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none';" always;

  client_max_body_size 10M;

  # Health & Readiness Probes (Bypasses rate limiting for load balancer monitors)
  location ~ ^/(health|ready)$ {
    proxy_pass http://smartneb_backend_cluster;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 5s;
  }

  # Socket.IO WebSocket (wss://) & Long Polling Reverse Proxy
  location /socket.io/ {
    proxy_pass http://smartneb_backend_cluster;
    proxy_http_version 1.1;

    # Mandatory WebSocket Upgrade headers
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Timeouts tuned for WebSocket heartbeat keep-alives
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_buffering off;
  }

  # Standard REST HTTP API
  location / {
    proxy_pass http://smartneb_backend_cluster;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
