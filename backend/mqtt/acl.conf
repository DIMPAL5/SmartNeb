# ==============================================================================
# SMARTNEB HOSTED MQTT BROKER ACCESS CONTROL LIST (EMQX / HiveMQ / Mosquitto)
# Rule evaluation order: top to bottom, first match wins
# TLS Port: 8883 (MQTTS)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Platform SuperAdmin & Central Backend Service
# ------------------------------------------------------------------------------
user "backend_service_client"
  topic readwrite hospitals/+/devices/+/telemetry/#
  topic readwrite hospitals/+/devices/+/commands/#
  topic readwrite hospitals/+/devices/+/status/#
  topic readwrite $SYS/#

# ------------------------------------------------------------------------------
# 2. Hospital Technicians & Staff Clients (Scoped to their specific Hospital ID)
# ------------------------------------------------------------------------------
# Pattern: user starts with "hosp_staff_{hospitalId}"
pattern readwrite hospitals/%u/devices/+/telemetry/#
pattern readwrite hospitals/%u/devices/+/commands/#

# ------------------------------------------------------------------------------
# 3. Individual ESP32 Nebulizer Hardware Devices (Strict Per-Device Isolation)
# Username format: "dev_{hospitalId}_{deviceCode}"
# ClientId format: "{deviceCode}"
# ------------------------------------------------------------------------------
# A device can ONLY publish its own telemetry and battery metrics:
pattern write hospitals/%c/devices/%u/telemetry/health
pattern write hospitals/%c/devices/%u/telemetry/env
pattern write hospitals/%c/devices/%u/telemetry/battery
pattern write hospitals/%c/devices/%u/status

# A device can ONLY subscribe to its own incoming commands:
pattern read hospitals/%c/devices/%u/commands
pattern write hospitals/%c/devices/%u/commands/ack

# ------------------------------------------------------------------------------
# 4. Default Deny All Other Unauthenticated / Cross-Tenant Topics
# ------------------------------------------------------------------------------
user *
  topic deny #
